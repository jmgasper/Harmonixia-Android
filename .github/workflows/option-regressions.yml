name: Option Regressions

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: option-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  option-regressions:
    name: Option regressions (${{ matrix.mode.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: syntax-only
            flag: --syntax-only
          - name: behavior-only
            flag: --behavior-only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run local validation option regressions (${{ matrix.mode.name }})
        run: ./scripts/test-local-validation-option-regressions.sh ${{ matrix.mode.flag }}
