name: Option Regressions

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/option-regressions.yml
      - scripts/validate-local.sh
      - scripts/smoke-debug-emulator.sh
      - scripts/test-*-options.sh
      - scripts/test-local-validation-option-regressions*.sh
      - docs/local-validation-workflow.md
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/option-regressions.yml
      - scripts/validate-local.sh
      - scripts/smoke-debug-emulator.sh
      - scripts/test-*-options.sh
      - scripts/test-local-validation-option-regressions*.sh
      - docs/local-validation-workflow.md
  workflow_dispatch:

concurrency:
  group: option-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  option-regressions:
    name: Option regressions (${{ matrix.mode.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: syntax-only
            command: ./scripts/test-local-validation-option-regressions.sh --syntax-only
          - name: behavior-only
            command: ./scripts/test-local-validation-option-regressions.sh --behavior-only
          - name: runner-self-test
            command: ./scripts/test-local-validation-option-regressions-runner.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run local validation option regressions (${{ matrix.mode.name }})
        run: ${{ matrix.mode.command }}
